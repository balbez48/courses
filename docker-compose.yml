version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: course_platform_db
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: course_db
    ports:
      - "5432:5432"
    volumes:
    - ./services/course-service/db/courses_init.sql:/docker-entrypoint-initdb.d/01_init.sql
    - ./services/course-service/db/audit/init.sql:/docker-entrypoint-initdb.d/02_audit_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d course_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  course_service:
    build:
      context: ./services/course-service
      dockerfile: Dockerfile
    container_name: course_service_container
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USER: postgres_user
      DB_PASSWORD: postgres_password
      DB_NAME: course_db
    ports:
      - "8001:8000"