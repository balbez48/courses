<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Степик, но не Яндекс</title>
  <desc id="desc">Синий логотип образовательного сайта: выпускная шапочка, ученик и раскрытая книга рядом с надписью «степик» и слоганом «но не Яндекс».</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#168BFF"/>
      <stop offset="100%" stop-color="#0647B8"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123E8C"/>
      <stop offset="100%" stop-color="#082C70"/>
    </linearGradient>
  </defs>
  <rect width="900" height="320" fill="#FFFFFF"/>
  <!-- Graduation cap -->
  <path d="M44 82 L168 25 L292 82 L168 137 Z" fill="url(#blue)"/>
  <path d="M83 101 L168 137 L253 101 L253 131 Q168 178 83 131 Z" fill="url(#navy)"/>
  <path d="M292 82 L292 133" fill="none" stroke="#0647B8" stroke-width="7" stroke-linecap="round"/>
  <path d="M281 133 Q292 124 303 133 L308 154 Q292 166 276 154 Z" fill="url(#navy)"/>
  <!-- Student -->
  <circle cx="168" cy="157" r="24" fill="url(#blue)"/>
  <path d="M135 205 Q168 177 201 205 L168 248 Z" fill="url(#navy)"/>
  <!-- Open book -->
  <path d="M28 214 Q85 200 139 233 L168 265 L168 286 Q105 242 40 258 Z" fill="#58B2FF"/>
  <path d="M308 214 Q251 200 197 233 L168 265 L168 286 Q231 242 296 258 Z" fill="#58B2FF"/>
  <path d="M22 254 Q94 236 168 286 Q242 236 314 254 L302 280 Q232 267 168 309 Q104 267 34 280 Z" fill="url(#blue)"/>
  <!-- Wordmark and tagline -->
  <text x="350" y="145" font-family="Arial, Helvetica, sans-serif" font-size="91" font-weight="700" letter-spacing="-3" fill="url(#navy)">степик</text>
  <text x="354" y="207" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="500" fill="#526D9B">но не Яндекс</text>
</svg>
